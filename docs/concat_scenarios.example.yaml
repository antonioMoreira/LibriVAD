# =============================================================================
# Concat scenarios on LibriSpeech: example configuration, version 2
# =============================================================================
# Read by the scenario builder:
#   uv run python -m librivad.generation.build_scenarios \
#       --config docs/concat_scenarios.example.yaml --dry-run
# Usage guide: docs/scenario_builder.md. Paths are relative to PROJECT_ROOT.
#
# The file has two independent parts:
#   dataset   : everything specific to the source corpus (folder layout, the
#               fields in each path, where labels come from, and which files
#               are consecutive pieces of one recording). Swap this block to
#               use another corpus.
#   scenarios : the construction rules. They only use generic concepts and
#               the field names that `dataset` declares.
#
# Glossary
#   utterance    : one audio file of the dataset.
#   speech block : one or more utterances joined back to back.
#   noise block  : the inserted non-speech segment (label 0).
#   noise_ratio  : len(noise block) / len(final file), in [0, 1).
#   snr_db       : how far the noise block's RMS sits below the RMS of the
#                  speech samples (label 1) of the speech block, in dB. The
#                  same definition as the SNR of create_LibriVAD.py. Version 1
#                  of this file called it noise_level_db, with the sign flipped.
#   loudness_lu  : how far the noise's integrated loudness (ITU-R BS.1770, LUFS)
#                  sits below that of the speech block, in LU. Same sign as snr_db.
#   span         : noise_block.span. `block` puts the noise in the noise block
#                  only; `file` runs one excerpt under the whole output and adds
#                  the speech on top (the noise block is then the part without
#                  speech).
#
# Worked example (noise_first below): target 30 s, noise_ratio 0.5
#   -> speech block >= 15 s
#   -> noise block = floor(0.5 / (1 - 0.5) * len(speech block)) ~= 15 s
#   -> final file ~= 30 s, exactly 50 % noise block.
#
# Merging: every scenario is deep-merged over `defaults`, so a scenario only
# lists the keys it changes, at any nesting level. `conditions` lists the
# values a scenario sweeps; each combination becomes its own folder.
#
# Changes from version 1: version 2; noise_level_db -> snr_db (negated);
# noise_ratio moved under noise_length (or into conditions to sweep it);
# output.filename -> output.path (a template for the whole relative path);
# overshoot_policy and ratio_basis are not implemented and were removed.
# post_mixing became noise_block.span: file, and lufs loudness.measure: lufs.
# =============================================================================

version: 2
seed: 1234                      # Controls every random choice (noise offsets, sampling).

# -----------------------------------------------------------------------------
# Dataset adapter (the only corpus-specific part)
# -----------------------------------------------------------------------------
dataset:
  name: librispeech
  adapter: path_pattern         # path_pattern | audiofolder
  root: files/datasets/LibriSpeech
  sample_rate: 16000
  splits:                       # Generic split name -> folder in this corpus.
    train: train-clean-100
    val: dev-clean
    test: test-clean

  # Fields parsed from the path relative to `root`.
  path_pattern: "{split}/{speaker}/{chapter}/{speaker}-{chapter}-{utt}.wav"
  exclude_list: files/Forced_alignments/librispeech_alignments/unaligned.txt

  # Where the speech/non-speech labels of each utterance come from:
  #   textgrid : forced alignments (empty word = silence)
  #   npy      : precomputed 0/1 array per file
  #   words    : the word list of a metadata row (audiofolder)
  #   none     : no labels; the whole utterance is treated as speech
  labels:
    source: textgrid
    dir: files/Forced_alignments/librispeech_alignments
    path: "{split_folder}/{speaker}/{chapter}/{stem}.TextGrid"
    tier: words
    silence_token: ""

  # Which files are consecutive pieces of one continuous recording, and in
  # what order. Leave it as null when the corpus has no such notion; the
  # `contiguous` composition is then unavailable.
  continuity:
    group_by: [speaker, chapter]
    order_by: utt

# -----------------------------------------------------------------------------
# Noise sources that scenarios refer to by name
# -----------------------------------------------------------------------------
noise_sources:
  dataset_silence:              # Label-0 regions cut from the dataset itself (room tone).
    type: extracted_from_dataset
    split: train                # Generic split name, resolved through dataset.splits.
    cache: files/datasets/LibriSpeech/train100_silence.wav
  babble:
    type: file_per_split        # {split} -> train | val | test
    path: files/Noises/Babble_noise/Babble_noise_{split}.wav
  city:
    type: file_per_split
    path: files/Noises/City_noise/City_noise_{split}.wav

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  root: files/datasets/ConcatScenarios
  # Template of each output's path below `root`. A scenario can replace it with
  # its own `output_path`. Every swept condition must appear in it.
  path: "{scenario}/{split_folder}/ratio_{noise_ratio}/snr_{snr_db:02d}/{first[stem]}.wav"
  metadata_dir: null            # set to a parent folder template to write metadata.parquet
  write_npy_labels: true        # one 0/1 .npy per output, same relative path
  labels_root: files/Labels/ConcatScenarios
  normalization: peak           # peak (like lf.scale_signal) | none
  peak_dbfs: -1.0
  clip_guard: "off"             # only used with normalization: none

# -----------------------------------------------------------------------------
# Defaults (dataset-agnostic)
# -----------------------------------------------------------------------------
defaults:
  speech_block:
    # How the speech block is built:
    #   single      : one utterance per speech slot. With a speech target and
    #                 `duration_tolerance`, only utterances close to the target.
    #   contiguous  : consecutive utterances from one `dataset.continuity` group,
    #                 in order, so the block is (nearly) one continuous recording.
    #   concatenate : any utterances joined together, optionally only within
    #                 `group_by`. Every join is an artificial cut.
    composition: single
    duration_tolerance: 0.15
    max_utterances: 10
    group_by: []
    join_gap_s: 0.0             # Silence added at each join (label 0).
    join_fade_ms: 10            # Fade at each join to avoid clicks.
    selection: sequential       # sequential (reproducible) | shuffled (uses seed)

  noise_length:
    # ratio          : noise = floor(speech * p / (1 - p)); the speech target is
    #                  (1 - p) * target_duration_s when a target is set.
    # fill_to_target : noise = target - speech; skipped below min_noise_s.
    mode: ratio
    target_duration_s: 30

  noise_block:
    source: dataset_silence
    span: block                 # block | file (one excerpt under the whole output)
    slicing: sequential_wrap    # sequential_wrap | random_offset
    fade_ms: 10                 # span block only

  loudness:
    measure: rms                # rms (snr_db) | lufs (loudness_lu) | fixed_gain
    # true = measure the speech block on label-1 samples only.
    speech_only: true

# -----------------------------------------------------------------------------
# Scenarios
# -----------------------------------------------------------------------------
scenarios:

  # Scenario 1: Noise + Audio_i
  - name: noise_first
    layout: [noise, speech]
    speech_block:
      composition: contiguous   # LibriSpeech has continuity; use `single` otherwise.
    conditions:
      noise_ratio: [0.25, 0.50, 0.75]
      snr_db: [30, 20, 10, 0]   # 0 dB = noise as loud as speech.

  # Scenario 2: Audio_i + Noise
  - name: noise_last
    layout: [speech, noise]
    speech_block:
      composition: contiguous
    conditions:
      noise_ratio: [0.25, 0.50, 0.75]
      snr_db: [30, 20, 10, 0]

  # Scenario 1 on a corpus without continuity: one utterance per file, so the
  # 30 s target becomes "utterances of about 15 s" for ratio 0.5.
  - name: noise_first_single
    layout: [noise, speech]
    speech_block:
      composition: single
      duration_tolerance: 0.20
    noise_block:
      source: null
      slicing: random_offset
    conditions:
      noise: [babble]
      noise_ratio: [0.50]
      snr_db: [10]
    output_path: "{scenario}/{split_folder}/{noise}/snr_{snr_db:02d}/{first[stem]}.wav"

  # Noise under the whole file: 30 s of babble, speech over its first part, the
  # rest noise only. Levelled by loudness instead of SNR. A scenario whose level
  # factor differs from `output.path` gives its own paths.
  - name: noise_last_lufs
    layout: [speech, noise]
    speech_block:
      composition: single
      duration_tolerance: 0.20
      edge_fade_ms: 10          # the default with span: file
    noise_length:
      mode: ratio
      noise_ratio: 0.50
    noise_block:
      source: babble
      span: file
      slicing: random_offset
    loudness:
      measure: lufs
    conditions:
      loudness_lu: [-5, 0, 10]  # negative: noise louder than the speech
    output_path: "{scenario}/{split_folder}/lu_{loudness_lu:02d}/{first[stem]}.wav"

  # The paper's noisy LibriVAD (create_LibriVAD.py): noise over the whole
  # utterance, no noise-only part, peak-normalized. Needs `normalization: peak`.
  # - name: paper_noisy
  #   layout: [speech]
  #   speech_block: {composition: single, edge_fade_ms: 0}
  #   noise_block: {source: babble, span: file, slicing: sequential_wrap}
  #   conditions: {snr_db: [-5, 0, 5, 10, 15, 20]}

  # Reference: the paper setup (LibriSpeechConcat). Pairs of files in sorted
  # order (speaker changes allowed), gap = 25 % of the pair (20 % of the file),
  # fixed gain 0.001, peak-normalized to full scale. The working copy of this
  # scenario is configs/scenarios/librispeech_middle.yaml.
  - name: middle
    layout: [speech, noise, speech]
    speech_block:
      composition: concatenate
      max_utterances: 1
      join_fade_ms: 0
    noise_length:
      mode: ratio
      noise_ratio: 0.20
      target_duration_s: null   # No target: one utterance per speech slot.
    noise_block:
      fade_ms: 0
    loudness:
      measure: fixed_gain
      gain: 0.001
    output_path: "{scenario}/{split_folder}/{last[speaker]}/{last[chapter]}/{first[stem]}_+_{last_suffix}.wav"

# -----------------------------------------------------------------------------
# Validation rules the loader enforces (see docs/scenario_builder.md)
# -----------------------------------------------------------------------------
# - layout contains exactly one `noise` (at most one with span: file);
#   `speech` appears once or twice.
# - composition contiguous requires `dataset.continuity`.
# - Fields used in group_by / continuity / templates must exist in the dataset.
# - noise source `extracted_from_dataset` requires labels other than none.
# - mode ratio: 0 <= noise_ratio < 1, given once (noise_length or conditions).
# - mode fill_to_target: target_duration_s > min_noise_s >= 0.
# - snr_db >= constraints.min_snr_db when the constraint is set.
# - loudness rms needs snr_db, lufs needs loudness_lu, and each excludes the
#   other's factor; fixed_gain needs loudness.gain.
# - population: every factor appears once per split, in crossed or assigned.
