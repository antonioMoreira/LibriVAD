# SkylarDataset `noisy` subset, built from the `clean` subset (skylar-dataset Plan 5).
#
# Every output is 30 s of one noise excerpt at one gain, with the clean file added on top at
# the end (`noise_first_*`) or the start (`noise_last_*`), faded in and out over 10 ms; the
# rest is noise only. The level is set by `snr_db` (speech-only RMS over noise RMS) in the
# `*_snr` scenarios and by `loudness_lu` (BS.1770 integrated loudness of the clean file over
# that of the noise) in the `*_lufs` ones; negative values put the noise above the speech.
#
# Generated by skylar-dataset's `noisy.config.render_librivad_config` from its
# `configs/noisy.yaml` (`noisy build` writes the same, with its own paths, to
# `.provenance/noisy/<ts>-scenarios.yaml`). Regenerate rather than edit by hand.

version: 2
seed: 1234
dataset:
  name: skylar_clean
  adapter: audiofolder
  root: /mnt/HD1TB/skylar-dataset/outputs/SkylarDataset/clean
  schema_version: 1
  sample_rate: 16000
  splits:
    train: train
    val: val
    test: test
  metadata_glob: '{split}/*/{metadata_file}'
  id_field: id
  passthrough_fields:
  - language
  - duration_bucket
  - text
  - speaker
  - dnsmos
  - dataset
  - component
  - locale
  - source_id
  - source
  labels:
    source: words
    field: words
    bridge_gaps_ms: 0
  continuity: null
noise_sources:
  babble:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Babble_noise/Babble_noise_{split}.wav
  ssn:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/SSN_noise/SSN_noise_{split}.wav
  domestic:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Domestic_noise/Domestic_noise_{split}.wav
  nature:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Nature_noise/Nature_noise_{split}.wav
  office:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Office_noise/Office_noise_{split}.wav
  public:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Public_noise/Public_noise_{split}.wav
  street:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Street_noise/Street_noise_{split}.wav
  transport:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/Transport_noise/Transport_noise_{split}.wav
  city:
    type: file_per_split
    path: /mnt/HD1TB/LibriVAD/files/Noises/City_noise/City_noise_{split}.wav
output:
  root: /mnt/HD1TB/skylar-dataset/outputs/SkylarDataset/noisy
  path: '{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}/{duration_bucket}/{id}.wav'
  metadata_dir: '{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}'
  metadata_format: parquet
  write_npy_labels: false
  dtype: int16
  normalization: none
  clip_guard: per_group
  limits:
    max_files_total: 100000
    max_files_per_folder: 10000
defaults:
  speech_block:
    composition: single
    edge_fade_ms: 10.0
  noise_length:
    mode: fill_to_target
    target_duration_s: 30.0
    min_noise_s: 2.0
  noise_block:
    span: file
    slicing: random_offset
    key:
    - id
    - scenario
    - noise
  loudness:
    speech_only: true
    min_speech_s: 0.5
    min_speech_rms_dbfs: -60.0
scenarios:
- name: noise_first_snr
  layout:
  - noise
  - speech
  loudness:
    measure: rms
  conditions:
    snr_db:
    - -5
    - 0
    - 5
    - 10
    - 15
    - 20
  output_path: '{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}/{duration_bucket}/{id}.wav'
  metadata_dir: '{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}'
- name: noise_first_lufs
  layout:
  - noise
  - speech
  loudness:
    measure: lufs
  conditions:
    loudness_lu:
    - -5
    - 0
    - 5
    - 10
    - 15
    - 20
  output_path: '{split}/{scenario}/{noise}/lu_{loudness_lu:02d}/{language}/{duration_bucket}/{id}.wav'
  metadata_dir: '{split}/{scenario}/{noise}/lu_{loudness_lu:02d}/{language}'
- name: noise_last_snr
  layout:
  - speech
  - noise
  loudness:
    measure: rms
  conditions:
    snr_db:
    - -5
    - 0
    - 5
    - 10
    - 15
    - 20
  output_path: '{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}/{duration_bucket}/{id}.wav'
  metadata_dir: '{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}'
- name: noise_last_lufs
  layout:
  - speech
  - noise
  loudness:
    measure: lufs
  conditions:
    loudness_lu:
    - -5
    - 0
    - 5
    - 10
    - 15
    - 20
  output_path: '{split}/{scenario}/{noise}/lu_{loudness_lu:02d}/{language}/{duration_bucket}/{id}.wav'
  metadata_dir: '{split}/{scenario}/{noise}/lu_{loudness_lu:02d}/{language}'
conditions:
  noise:
  - babble
  - ssn
  - domestic
  - nature
  - office
  - public
  - street
  - transport
  - city
population:
  train:
    crossed: []
    assigned:
    - scenario
    - noise
    - snr_db
    - loudness_lu
  val:
    crossed:
    - snr_db
    - loudness_lu
    assigned:
    - scenario
    - noise
  test:
    crossed:
    - snr_db
    - loudness_lu
    - scenario
    assigned:
    - noise
  strata:
  - language
  - duration_bucket
