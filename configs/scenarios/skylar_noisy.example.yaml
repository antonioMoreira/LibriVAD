# SkylarDataset `noisy` subset, built from the `clean` subset (plan 2 §5.1).
#
# Every output is 30 s: the clean file plus a noise block that fills the rest, before the
# speech (`noise_first`) or after it (`noise_last`). `snr_db` is how far the noise RMS sits
# below the speech-only RMS of the clean file; the noise is never louder than the speech.
# skylar-dataset's plan 3 renders this file with its own paths and runs the builder on it.

version: 2
seed: 1234

dataset:
  name: skylar_clean
  adapter: audiofolder                   # metadata.parquet per {split}/{lang} folder
  root: /mnt/HD1TB/skylar-dataset/outputs/SkylarDataset/clean
  schema_version: 1                       # must equal ../.provenance/schema.json
                                          # (its metadata_file names the metadata file)
  sample_rate: 16000                      # every file is checked, never resampled here
  splits: {train: train, val: val, test: test}
  metadata_glob: "{split}/*/{metadata_file}"
  id_field: id
  passthrough_fields: [language, duration_bucket, text, speaker, dnsmos, dataset, component, locale, source_id, source]
  labels:
    source: words
    field: words
    bridge_gaps_ms: 0                     # 0 keeps every pause between words
  continuity: null

noise_sources:
  babble:    {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Babble_noise/Babble_noise_{split}.wav"}
  ssn:       {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/SSN_noise/SSN_noise_{split}.wav"}
  domestic:  {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Domestic_noise/Domestic_noise_{split}.wav"}
  nature:    {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Nature_noise/Nature_noise_{split}.wav"}
  office:    {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Office_noise/Office_noise_{split}.wav"}
  public:    {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Public_noise/Public_noise_{split}.wav"}
  street:    {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Street_noise/Street_noise_{split}.wav"}
  transport: {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/Transport_noise/Transport_noise_{split}.wav"}
  city:      {type: file_per_split, path: "/mnt/HD1TB/LibriVAD/files/Noises/City_noise/City_noise_{split}.wav"}

output:
  root: /mnt/HD1TB/skylar-dataset/outputs/SkylarDataset/noisy
  path: "{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}/{duration_bucket}/{id}.wav"
  metadata_dir: "{split}/{scenario}/{noise}/snr_{snr_db:02d}/{language}"
  metadata_format: parquet                # one explicit schema; file_name relative to metadata_dir
  write_npy_labels: false                 # the shifted `words` carry the labels
  dtype: int16
  normalization: none
  clip_guard: per_group                   # one guard gain for every level of a file
  drop_fields: [seek, tokens, temperature, compression_ratio]
  limits: {max_files_total: 100000, max_files_per_folder: 10000}

defaults:
  speech_block: {composition: single}
  noise_length: {mode: fill_to_target, target_duration_s: 30, min_noise_s: 2.0}
  noise_block: {slicing: random_offset, key: [id, scenario, noise], fade_ms: 10}
  # Sources quieter than min_speech_rms_dbfs (or than the highest snr_db allows in int16)
  # are skipped as too_quiet.
  loudness: {measure: rms, speech_only: true, min_speech_s: 0.5, min_speech_rms_dbfs: -60}
  constraints: {min_snr_db: 0}            # noise never louder than the source

scenarios:
  - {name: noise_first, layout: [noise, speech]}
  - {name: noise_last,  layout: [speech, noise]}

conditions:
  noise: [babble, ssn, domestic, nature, office, public, street, transport, city]
  snr_db: [0, 5, 10, 15, 20, 25, 30, 35]

population:                               # factors: scenario, noise, snr_db
  train: {crossed: [],                 assigned: [scenario, noise, snr_db]}
  val:   {crossed: [snr_db],           assigned: [scenario, noise]}
  test:  {crossed: [snr_db, scenario], assigned: [noise]}
  strata: [language, duration_bucket]     # assigned values are balanced inside each stratum
